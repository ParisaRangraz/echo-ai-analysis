name: tests

# Run on every push and every pull request to the main branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Only the packages the tests actually need. The tests use synthetic
      # arrays rather than the CAMUS dataset, so they run anywhere -- no data,
      # no PyTorch, no GPU.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy scikit-image SimpleITK pytest

      - name: Run tests
        run: pytest